<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <defs>
    <linearGradient id="ht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0B2A6"/>
      <stop offset="1" stop-color="#8E8F82"/>
    </linearGradient>
    <linearGradient id="hm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A9B8E"/>
      <stop offset="1" stop-color="#7A7B6E"/>
    </linearGradient>
    <linearGradient id="hb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#807B76"/>
      <stop offset="1" stop-color="#605C56"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0C1BA"/>
      <stop offset="1" stop-color="#90918A"/>
    </linearGradient>
    <linearGradient id="eg" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5C5B56"/>
      <stop offset="1" stop-color="#3A3934"/>
    </linearGradient>
  </defs>

  <!-- Main hull body — elongated Frontier capital ship silhouette -->
  <path d="
    M 10,50  L 20,44  36,40  50,38  70,37  90,36  110,36  136,36
    L 155,38  175,42  195,48  215,54  230,58  236,60
    L 230,62  215,68  195,74  175,80  155,84  136,87
    L 110,90  90,90  70,88  50,84  36,76  20,70  10,66
    Z"
    fill="url(#hm)" stroke="#505048" stroke-width="1.2"/>

  <!-- Upper hull plates — lighter top surfaces -->
  <path d="
    M 20,44  36,40  50,38  70,37  90,36  110,36  136,36
    L 155,38  175,42  195,48  215,54
    L 215,58  195,56  175,54  155,52  136,50  110,49  90,49  70,50  50,52  36,54  20,56
    Z"
    fill="url(#ht)" opacity="0.7"/>

  <!-- Lower hull plates — darker belly -->
  <path d="
    M 20,64  36,66  50,72  70,78  90,82  110,84  136,87
    L 155,84  175,80  195,74  215,68
    L 215,62  195,62  175,62  155,62  136,62  110,62  90,62  70,62  50,62  36,62  20,62
    Z"
    fill="url(#hb)" opacity="0.6"/>

  <!-- Superstructure — raised command section -->
  <path d="
    M 50,38  50,28  62,22  82,18  108,17  122,18  132,22  136,30  136,36
    L 50,38  Z"
    fill="url(#sg)" stroke="#6A6A62" stroke-width="0.8"/>

  <!-- Superstructure equipment block -->
  <rect x="72" y="16" width="40" height="4" rx="1" fill="#A0A196" stroke="#707068" stroke-width="0.5"/>

  <!-- Upper engine nacelle housing -->
  <path d="M 10,46  18,42  18,50  10,50 Z" fill="#5A5954" stroke="#4A4944" stroke-width="0.5"/>
  <!-- Lower engine nacelle housing -->
  <path d="M 10,66  18,70  18,62  10,62 Z" fill="#5A5954" stroke="#4A4944" stroke-width="0.5"/>

  <!-- Engine nozzles -->
  <rect x="3" y="44" width="8" height="4" rx="1.2" fill="#2E2D2A"/>
  <rect x="3" y="52" width="8" height="4" rx="1.2" fill="#2E2D2A"/>
  <rect x="3" y="60" width="8" height="4" rx="1.2" fill="#2E2D2A"/>
  <rect x="3" y="68" width="8" height="4" rx="1.2" fill="#2E2D2A"/>
  <!-- Engine glow hints -->
  <rect x="3" y="45" width="4" height="2" rx="0.8" fill="#D09050" opacity="0.7"/>
  <rect x="3" y="53" width="4" height="2" rx="0.8" fill="#D09050" opacity="0.7"/>
  <rect x="3" y="61" width="4" height="2" rx="0.8" fill="#D09050" opacity="0.7"/>
  <rect x="3" y="69" width="4" height="2" rx="0.8" fill="#D09050" opacity="0.7"/>

  <!-- Central hull spine -->
  <line x1="22" y1="58" x2="230" y2="60" stroke="#6A6960" stroke-width="1.2" opacity="0.45"/>

  <!-- Hull panel seams — vertical -->
  <line x1="50" y1="38" x2="50" y2="84" stroke="#5C5B56" stroke-width="0.6" opacity="0.55"/>
  <line x1="78" y1="24" x2="78" y2="89" stroke="#5C5B56" stroke-width="0.5" opacity="0.55"/>
  <line x1="108" y1="17" x2="108" y2="90" stroke="#5C5B56" stroke-width="0.5" opacity="0.55"/>
  <line x1="136" y1="30" x2="136" y2="87" stroke="#5C5B56" stroke-width="0.5" opacity="0.55"/>
  <line x1="165" y1="40" x2="165" y2="82" stroke="#5C5B56" stroke-width="0.5" opacity="0.55"/>
  <line x1="195" y1="48" x2="195" y2="74" stroke="#5C5B56" stroke-width="0.5" opacity="0.55"/>

  <!-- Hull panel seams — horizontal -->
  <line x1="25" y1="48" x2="215" y2="50" stroke="#5C5B56" stroke-width="0.4" opacity="0.4"/>
  <line x1="25" y1="70" x2="215" y2="70" stroke="#5C5B56" stroke-width="0.4" opacity="0.4"/>

  <!-- Turret / port mounts — 3 large circular features (key recognition element) -->
  <circle cx="62" cy="58" r="7.5" fill="#6C6B64" stroke="#8C8B84" stroke-width="1"/>
  <circle cx="62" cy="58" r="3.2" fill="#3C3B36"/>

  <circle cx="115" cy="58" r="9" fill="#6C6B64" stroke="#8C8B84" stroke-width="1"/>
  <circle cx="115" cy="58" r="4" fill="#3C3B36"/>

  <circle cx="168" cy="58" r="7.5" fill="#6C6B64" stroke="#8C8B84" stroke-width="1"/>
  <circle cx="168" cy="58" r="3.2" fill="#3C3B36"/>

  <!-- Recessed hull bays -->
  <rect x="84" y="42" width="10" height="7" rx="1" fill="#3A3936" opacity="0.6"/>
  <rect x="84" y="70" width="10" height="7" rx="1" fill="#3A3936" opacity="0.6"/>
  <rect x="142" y="44" width="10" height="6" rx="1" fill="#3A3936" opacity="0.6"/>
  <rect x="142" y="70" width="10" height="6" rx="1" fill="#3A3936" opacity="0.6"/>

  <!-- Bow hull plate facets -->
  <path d="M 200,50 L 218,55 218,58 200,56 Z" fill="#8A8982" opacity="0.3"/>
  <path d="M 200,72 L 218,67 218,62 200,64 Z" fill="#64635E" opacity="0.3"/>

  <!-- Bridge windows -->
  <rect x="80" y="19" width="22" height="4" rx="1.2" fill="#2E5A7A" opacity="0.9"/>
  <rect x="82" y="20" width="4" height="2" rx="0.5" fill="#4E8AB0" opacity="0.8"/>
  <rect x="88" y="20" width="4" height="2" rx="0.5" fill="#4E8AB0" opacity="0.8"/>
  <rect x="94" y="20" width="4" height="2" rx="0.5" fill="#4E8AB0" opacity="0.8"/>

  <!-- Running / navigation lights -->
  <circle cx="235" cy="60" r="1.8" fill="#E0E0D8" opacity="0.9"/>
  <circle cx="12" cy="44" r="1.3" fill="#90D080" opacity="0.7"/>
  <circle cx="12" cy="72" r="1.3" fill="#D09080" opacity="0.7"/>

  <!-- Sensor mast -->
  <line x1="98" y1="17" x2="98" y2="12" stroke="#8A897E" stroke-width="1"/>
  <circle cx="98" cy="11" r="1.5" fill="#8A897E"/>
</svg>
