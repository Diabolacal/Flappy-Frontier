<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 40">
  <defs>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3D42"/>
      <stop offset="20%" stop-color="#2A2D32"/>
      <stop offset="100%" stop-color="#1E2025"/>
    </linearGradient>
  </defs>
  <rect width="128" height="40" fill="url(#groundGrad)"/>
  <!-- Top edge highlight -->
  <rect x="0" y="0" width="128" height="2" fill="#4A4E54"/>
  <!-- Panel lines -->
  <line x1="32" y1="2" x2="32" y2="40" stroke="#1E2025" stroke-width="1"/>
  <line x1="64" y1="2" x2="64" y2="40" stroke="#1E2025" stroke-width="1"/>
  <line x1="96" y1="2" x2="96" y2="40" stroke="#1E2025" stroke-width="1"/>
  <!-- Horizontal divider -->
  <line x1="0" y1="20" x2="128" y2="20" stroke="#1E2025" stroke-width="0.7"/>
  <!-- Rivet dots -->
  <circle cx="16" cy="10" r="1.5" fill="#1E2025"/>
  <circle cx="48" cy="10" r="1.5" fill="#1E2025"/>
  <circle cx="80" cy="10" r="1.5" fill="#1E2025"/>
  <circle cx="112" cy="10" r="1.5" fill="#1E2025"/>
  <circle cx="16" cy="30" r="1.5" fill="#1E2025"/>
  <circle cx="48" cy="30" r="1.5" fill="#1E2025"/>
  <circle cx="80" cy="30" r="1.5" fill="#1E2025"/>
  <circle cx="112" cy="30" r="1.5" fill="#1E2025"/>
</svg>
